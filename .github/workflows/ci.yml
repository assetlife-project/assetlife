name: CI
permissions: {}

on:
  push:
    branches: ["main", "maintenance/**", "develop/**", "maintenance", "develop"]
  pull_request:
    branches: ["main", "maintenance/**", "develop/**", "maintenance", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"

      - name: dprint
        run: uv run --locked dprint check

      - name: ruff check
        run: uv run --locked ruff check --output-format=github

      - name: ruff format
        run: uv run --locked ruff format --check

  typecheck:
    name: typecheck
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          activate-environment: true
          python-version: ${{ matrix.py }}

      - name: uv sync #  dev group is synced by default
        run: uv sync --no-editable

      - name: basedpyright
        run: basedpyright --warnings

  test:
    name: test
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows]
        py: ["3.12", "3.13", "3.14"]

    steps: #  see GH Actions in uv docs for recommandations
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.py }}
          activate-environment: true

      - name: Install dependencies
        shell: bash
        run: uv pip install . --exact --group dev

      - name: pytest
        run: pytest
