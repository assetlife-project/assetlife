name: CI
permissions: {}

on:
  push:
    branches: ["main", "maintenance/**", "develop/**", "maintenance", "develop"]
  pull_request:
    branches: ["main", "maintenance/**", "develop/**", "maintenance", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: dprint
        run: uv run --locked dprint check

      - name: ruff check
        run: uv run --locked ruff check --output-format=github

      - name: ruff format
        run: uv run --locked ruff format --check

  typecheck:
    name: typecheck
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.12", "3.14"]
    env:
      # Blocking only for PRs into main and pushes to main; advisory elsewhere (e.g. develop)
      TYPECHECK_BLOCKING: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          python-version: ${{ matrix.py }}

      - name: uv sync #  dev group is synced by default
        run: uv sync --no-editable

      - name: basedpyright
        id: basedpyright
        continue-on-error: ${{ env.TYPECHECK_BLOCKING != 'true' }}
        run: basedpyright --warnings

      - name: Flag advisory type errors
        if: steps.basedpyright.outcome == 'failure' && env.TYPECHECK_BLOCKING != 'true'
        run: echo "::warning title=basedpyright (advisory)::Type errors found. Not blocking on this branch; they must be fixed before develop → main."

  test:
    name: test
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows]
        py: ["3.12", "3.13", "3.14"]

    steps: #  see GH Actions in uv docs for recommandations
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.py }}
          activate-environment: true

      - name: Install dependencies
        shell: bash
        run: uv pip install . --exact --group dev

      - name: pytest
        run: pytest
