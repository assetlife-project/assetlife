name: Build and deploy Github pages
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 #  fetch all history for all tags and branches

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"

      - name: Extra installs
        # pandoc is required by sphinx extensions
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build Sphinx docs for every released version
        run: uvx --with tox-uv tox -e docs-versions

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # branch on which files are commited
          folder: ./docs/build/html/ # The folder the action should deploy.
          clean: true # drop files of the previous deployment that are no longer built

      - name: Save website as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: ./docs/build/html
          retention-days: 14
