[project]
name = "assetlife"
version = "0.3.0"
description = "Python library leveraging stochastic modeling to guide decision-making in asset management"
readme = "README.md"
authors = [{ name = "Thomas Guillon et al." }]
maintainers = [{ name = "AssetLife Developers" }]
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.11.1",
  "numpy>=2.4.6",
  "numpydoc>=1.10.0",
  "optype[numpy]>=0.17.1",
  "pandas>=2.3.3",
  "scipy>=1.17.1",
  "typing-extensions>=4.16.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Intended Audience :: Manufacturing",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

#  development dependencies (uv dev group)
[dependency-groups]
extra = [
  "jupyterlab>=4.6.3",
]
docs = [
  { include-group = "extra" },
  "nbsphinx>=0.9.8",
  "pydata-sphinx-theme>=0.21.0",
  "sphinx>=9.0.4",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7.0",
]
lint = [
  "dprint-py>=0.63.0.0",
  "ruff>=0.16.6",
]
test = [
  "lifelines>=0.30.3",
  "pytest>=9.1.1",
]
type = [
  "basedpyright>=1.40.0",
  "matplotlib-stubs>=0.3.11",
  "mypy>=2.3.1",
  "pandas-stubs>=3.0.5.260914",
  "scipy-stubs>=1.17.1.5",
]
dev = [
  { include-group = "extra" },
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "type" },
]

[tool.setuptools.package-data]
"assetlife.datasets.csv" = ["*.csv"]

# taken from https://github.com/jorenham/optype
# [based]pyright

[tool.pyright]
pythonPlatform = "All"
include = ["src/assetlife"]
ignore = [".venv"]
typeCheckingMode = "all"
enableReachabilityAnalysis = true
reportAny = false
reportExplicitAny = false # sometimes there's no way around it
reportImplicitStringConcatenation = false # not a linter
reportPrivateUsage = false # dupe of PLC2701
reportPrivateImportUsage = false # dupe of PLC2701
reportUnreachable = false # nothing wrong with `if sys.version_info() >= ...`
reportUnusedCallResult = false # https://github.com/microsoft/pyright/issues/8650
reportUnusedImport = false # dupe of F401
reportUnusedVariable = false # dupe of F841

#  ruff

[tool.ruff]
src = ["src"]
extend-exclude = [".git", ".venv"]
force-exclude = true
show-fixes = true
preview = true

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
exclude = ["*.ipynb"] #  no lints for nb, only formatting
ignore = [
  "any-type", # flake8-annotations
  "assert", # flake8-bandit
  "FBT", # flake8-boolean-trap
  "CPY", # flake8-copyright
  "FIX", # flake8-fixme
  "D", # pydocstyle
  "missing-trailing-comma", # conflict with formatter
  "docstring-missing-returns", # pydoclint
  "raise-vanilla-args", # tryceratops
  "non-empty-init-module", # ruff
]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = [
  "copy",
  "dataclasses",
  "inspect",
  "io",
  "json",
  "pickle",
  "string",
  "types",
  "typing",
]

[tool.ruff.lint.flake8-errmsg]
max-string-length = 42 # this took a while to figure out

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"datetime" = "dt"
"numpy" = "np"
"numpy.typing" = "npt"
"optype.numpy" = "onp"
"optype.typing" = "opt"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["collections.abc", "types"]

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["_typeshed", "typing_extensions"]
known-local-folder = ["assetlife"]
known-third-party = ["numpy"]

[tool.ruff.lint.pylint]
allow-dunder-method-names = [
  # methods
  "__func__",
  "__objclass__",
  "__self__",
  "__wrapped__",
  # `dlpack`
  "__dlpack__",
  "__dlpack_device__",
  # `numpy` special methods
  "__array__",
  "__array_finalize__",
  "__array_function__",
  "__array_priority__",
  "__array_ufunc__",
  "__array_wrap__",
  "__array_interface__",
  "__array_struct__",
]
allow-magic-value-types = ["int", "str"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
  "too-many-arguments",
  "too-many-positional-arguments",
  "no-self-use", # pytest test classes group tests, methods need not use self
]
"docs/source/conf.py" = [
  "implicit-namespace-package", # Sphinx loads conf.py as a script, not a package
  "builtin-variable-shadowing", # Sphinx requires a variable named `copyright`
  "commented-out-code", # disabled options are kept on purpose, as documentation
]

#  pytest

[tool.pytest]
minversion = "9.0"
#  ignore doctests at the moment
#  only give a whitelist where tests are valid
testpaths = [
  "src/assetlife/tests",
  "src/assetlife/datasets/tests",
  "src/assetlife/lifetime_models/tests",
  "src/assetlife/stochastic_processes/tests",
  "src/assetlife/policies/tests",
  "src/assetlife/sampling/tests",
]
addopts = ["-ra", "--doctest-modules"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL", "ELLIPSIS"]
filterwarnings = ["error"]
log_level = "INFO"
strict = true

#  tox

[tool.tox]
requires = ["tox-uv>=1"]
env_list = [
  "3.12",
  "3.13",
  "3.14",
]

[tool.tox.env_run_base]
description = "test with {base_python}"
labels = ["test"]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
commands = [
  [
    "pytest",
    { replace = "posargs", default = [], extend = true },
  ],
]

[tool.tox.env.lint]
description = "ruff check"
labels = ["lint"]
runner = "uv-venv-lock-runner"
dependency_groups = ["lint"]
commands = [
  [
    "ruff",
    "check",
    "--show-fixes",
    { replace = "posargs", default = [], extend = true },
  ],
  [
    "ruff",
    "format",
    "--check",
    { replace = "posargs", default = [], extend = true },
  ],
  [
    "dprint",
    "check",
    "--incremental=false",
    { replace = "posargs", default = [], extend = true },
  ],
]

[tool.tox.env.pyright]
description = "basedpyright"
runner = "uv-venv-lock-runner"
labels = ["type"]
dependency_groups = ["type", "test"]
commands = [
  [
    "basedpyright",
    { replace = "posargs", default = [], extend = true },
  ],
]

[tool.tox.env.docs]
description = "sphinx build"
labels = ["docs"]
runner = "uv-venv-lock-runner"
dependency_groups = ["docs"]
commands = [
  [
    "sphinx-build",
    "-M",
    "html",
    "./docs/source",
    "./docs/build",
    "--quiet",
    "--fail-on-warning",
    "--write-all",
    "--fresh-env",
  ],
  ["python", "-c", "print(f'Documentation can be accessed at : docs/build/html')"],
]

[tool.tox.env.docs-versions]
description = "sphinx build of latest plus every released version"
labels = ["docs-versions"]
runner = "uv-venv-runner"
skip_install = true
allowlist_externals = ["bash"]
# tox filters the environment, the script would otherwise not detect the CI run
pass_env = ["CI"]
commands = [
  ["bash", "docs/source/docs_versioning_build.sh"],
]
